name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  offline:
    # Everything that needs no API key: 314 unit tests plus the deterministic
    # retrieval regression. Free, seconds, runs on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Retrieval regression
        run: python scripts/check_regressions.py

  live:
    # ~$0.03 per evaluated question, so this is nightly or on demand rather than
    # per commit. Add [eval] to a commit message to force it.
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[eval]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Full regression suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_regressions.py --live --runs 3
      - name: Adversarial probes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_adversarial.py --live
