[project]
name = "delivery-copilot"
version = "0.1.0"
description = "Agentic delivery-risk service over Jira and Confluence"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `from app.risk.rules import ...` fails unless the package is
# installed. Adding the project root to sys.path is what makes a bare
# `pytest` work straight after clone.
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py311"
